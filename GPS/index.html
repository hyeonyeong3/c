<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>GPS 이동 경로</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
#map {
    height: 600px;
    width: 100%;
}
</style>
</head>

<body>

<h2>GPS 이동 경로 시각화</h2>

<div id="map"></div>

<script>

const map = L.map('map').setView(
    [42.363400, -71.098465], 15
);

L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: 'OpenStreetMap'
    }
).addTo(map);

fetch('output.json')
.then(response => response.json())
.then(data => {

    let route = [];

    data.forEach(point => {

        const lat = point.latitude;
        const lon = point.longitude;

        const speed = Number(
            point.info.match(/\d+/)[0]
        );

        route.push([lat, lon]);

        let color;

        if (speed < 18) {
            color = 'green';
        }
        else if (speed <= 20) {
            color = 'orange';
        }
        else {
            color = 'red';
        }

        L.circleMarker([lat, lon], {
            radius: 6,
            color: color,
            fillColor: color,
            fillOpacity: 1
        })
        .addTo(map)
        .bindPopup(
            '위도: ' + lat +
            '<br>경도: ' + lon +
            '<br>속도: ' + speed
        );

    });

    L.polyline(route, {
        color: 'blue',
        weight: 3
    }).addTo(map);

    if (route.length > 0) {
        map.fitBounds(route);
    }

})
.catch(error => {
    console.error('JSON 읽기 오류:', error);
});

</script>

</body>
</html>
